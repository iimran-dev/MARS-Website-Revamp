<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="marsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111F" />
      <stop offset="100%" stop-color="#0B1A2E" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="48" height="48" rx="10" fill="url(#marsBg)" />
  <rect width="48" height="48" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" />
  
  <!-- Outer orbital ring -->
  <ellipse
    cx="24"
    cy="24"
    rx="21"
    ry="9"
    transform="rotate(-28 24 24)"
    stroke="#FFFFFF"
    stroke-width="1.3"
    stroke-opacity="0.45"
    fill="none"
  />
  
  <!-- Mars red satellite node -->
  <circle cx="41.5" cy="13.5" r="2.4" fill="#E11D2A" />
  <circle cx="41.5" cy="13.5" r="3.6" fill="#E11D2A" opacity="0.25" />
  
  <!-- Core hexagon -->
  <path
    d="M24 6.5 L36.5 13.8 L36.5 32.2 L24 39.5 L11.5 32.2 L11.5 13.8 Z"
    stroke="#FFFFFF"
    stroke-width="1.6"
    fill="#0D223D"
    fill-opacity="0.6"
  />
  
  <!-- Precision Sigma glyph -->
  <path
    d="M18 16.5 H29.5 L20.8 24 H28.5 L18 31.5 H30"
    stroke="#FFFFFF"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
